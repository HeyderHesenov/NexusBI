name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt ruff
      - name: Lint (ruff)
        run: ruff check --select F app
      - name: Tests (pytest)
        run: pytest -q
      # The NL->SQL eval runs inside the suite above against the deterministic
      # keyless engine, so it costs nothing and needs no job of its own — which
      # also means the branch ruleset's required checks stay as they are.
      # `always()`: a red suite is exactly when the score is worth reading.
      - name: Publish nl2sql_exact@1
        if: always()
        run: |
          test -f eval-report.json || { echo "no eval report produced"; exit 0; }
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open("eval-report.json"))
          def row(name, e):
              score = "n/a" if e["score"] is None else f"{e['score']:.2f}"
              return f"| {name} | {score} | {e['correct']}/{e['total']} |"
          print(f"### NL→SQL eval — `nl2sql_exact@1` (engine: `{r['engine']}`)\n")
          print("| slice | score | correct |")
          print("|---|---|---|")
          print(row("core (gated)", r["by_tier"]["core"]))
          print(row("full", r["by_tier"]["full"]))
          print(row("**all**", r["overall"]))
          print(row("az", r["by_lang"]["az"]))
          print(row("en", r["by_lang"]["en"]))
          if r["failures"]:
              print(f"\n<details><summary>{len(r['failures'])} unsolved</summary>\n")
              for f in r["failures"]:
                  print(f"- `{f['id']}` ({f['tier']}) — {f['question']}")
              print("\n</details>")
          PY
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nl2sql-eval-report
          path: backend/eval-report.json
          if-no-files-found: ignore

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit tests (vitest)
        run: npm run test
      - name: Build
        run: npm run build

  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Install frontend deps + build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      # Boot the backend and run the smoke in ONE step: a background process
      # started in a step is killed when that step ends, so it must stay in the
      # same shell as the test run.
      - name: Boot backend (demo) + run E2E smoke
        env:
          DEMO_MODE: "true"
          SCHEDULER_ENABLED: "false"
          LIVE_REFRESH_ENABLED: "false"
          DIGEST_ENABLED: "false"
          CORS_ORIGINS: "http://localhost:4173"
        run: |
          (cd backend && alembic upgrade head)
          (cd backend && uvicorn app.main:app --host 0.0.0.0 --port 8000 &)
          # /ready, not /health: it also asserts the database is reachable and at
          # the migration head, so "booted but unmigrated" fails here instead of
          # surfacing as confusing 500s inside the E2E run.
          # 90s, not 30s: the DEMO_MODE seed runs during startup, and a slow
          # runner can still push it past a tight budget. The old 30s lost a run
          # to a backend that answered /ready 1.6 seconds later.
          for i in $(seq 1 90); do
            curl -sf http://localhost:8000/ready && break
            sleep 1
          done
          curl -sf http://localhost:8000/ready || (echo "backend not ready after 90s" && exit 1)
          cd frontend && npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  deploy-smoke:
    # Faza 0's exit criterion, run rather than asserted: a clean host, empty
    # volumes, one command, and the production stack has to come up non-demo,
    # migrated, unprivileged, restart-survivable and correctly unready when its
    # database dies. Nobody on the team has a container runtime locally, so this
    # job is the only place the production images are ever executed.
    name: Deploy smoke (docker compose)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Generous: the backend image pulls pandas, scipy and scikit-learn wheels on
    # every run, and nothing here is cached yet.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # The script dumps backend logs itself before tearing the stack down —
      # a separate `if: failure()` log step would run after that teardown and
      # find nothing.
      - name: Run the deploy smoke
        run: ./scripts/deploy_smoke.sh
