name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * *" # daily

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so leaked-then-deleted secrets are caught
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          # Required on pull_request events: without it the action aborts before
          # scanning anything. Push and schedule runs were green precisely because
          # they never took this code path, which hid the gap on the PR path.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
