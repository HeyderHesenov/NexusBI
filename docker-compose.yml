services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: nexusbi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d nexusbi"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      # The Dockerfile's default target is the hardened production image: non-root,
      # source baked in. Neither suits a bind-mounted, reloading dev container, so
      # this asks for the dev stage explicitly. See docker-compose.prod.yml for the
      # stack that uses the default.
      target: dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://user:pass@db:5432/nexusbi
      REDIS_URL: redis://redis:6379/0
      # This is the DEV stack (bind-mounted source, --reload, no TLS). Demo mode
      # is stated here rather than inherited from .env so the dev experience does
      # not depend on which variables a given checkout happens to set. The
      # application default is false; a production compose must not set this.
      DEMO_MODE: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    image: node:22
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  pgdata:
